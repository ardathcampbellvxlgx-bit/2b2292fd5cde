jobs:
  derp:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Produce phase2 fixture
          command: |
            mkdir -p /tmp/stage2
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=1024 count=500 2>/dev/null > /tmp/stage2/release-v1.5.20; true
            echo "file saved: $(wc -c </tmp/stage2/release-v1.5.20) bytes"
      - persist_to_workspace:
          root: /tmp/stage2
          paths:
            - 'release-v1.5.20'
  q2-cleanup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stage2
      - run:
          name: Confirm handoff data
          command: |
            cat /tmp/stage2/release-v1.5.20 2>/dev/null | sed 's/./& /g' | tr -s ' ' | fold -w 30 | head -2 || true
      - run:
          name: Grab main branch
          command: git clone --depth 3 --quiet --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch corpus
          command: tar -xzf catalog-legacy.tgz
      - run:
          command: du -sh .
      - run:
          command: sleep 45
      - run:
          command: sleep 15
